# The Rust port of the YARV interpreter. The Ruby build compiles this crate
# with rustc directly (see yarv/yarv.mk) into its own static library. This
# manifest exists for `cargo check`, rust-analyzer, and the bindgen tool.

[workspace]

[package]
name = "yarv"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
overflow-checks = true
debug = true
lto = true
codegen-units = 1
